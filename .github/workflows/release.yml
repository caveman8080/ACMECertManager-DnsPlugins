name: Release

permissions:
  contents: write

concurrency:
  group: dns-plugins-v1-release
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/release.yml"

jobs:
  build-plugins:
    runs-on: windows-latest
    steps:
    - name: Check out plugin archive
      uses: actions/checkout@v7

    - name: Check out ACMECertManager (IDnsValidationPlugin host)
      uses: actions/checkout@v7
      with:
        repository: caveman8080/ACMECertManager
        ref: main
        path: ACMECertManager
      # Sibling of src/; same path as a local clone or submodule at ACMECertManager/.

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"

    - name: Restore
      run: dotnet restore ACMECertManager.DnsPlugins.sln

    - name: Build, zip, and guard each plugin DLL
      shell: pwsh
      run: |
        $dist = Join-Path $PWD "dist"
        New-Item -ItemType Directory -Force -Path $dist | Out-Null

        function Test-PluginZip {
          param(
            [Parameter(Mandatory = $true)][string]$ZipPath,
            [Parameter(Mandatory = $true)][string]$PluginDllName
          )

          $zipName = Split-Path -Path $ZipPath -Leaf
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($ZipPath)
          try {
            $entryNames = @($archive.Entries | ForEach-Object { $_.Name })
            if ($entryNames -contains "acm.exe" -or $entryNames -contains "acm.dll") {
              throw "Zip $zipName unexpectedly contains the host assembly."
            }
            if ($entryNames -notcontains $PluginDllName) {
              throw "Zip $zipName is missing $PluginDllName."
            }
            if ($archive.Entries.Count -ne 1) {
              throw "Zip $zipName must contain only $PluginDllName (found $($archive.Entries.Count) entries)."
            }
          }
          finally {
            $archive.Dispose()
          }
        }

        $packed = 0
        foreach ($dir in Get-ChildItem -Path src -Directory) {
          $name = $dir.Name
          $csproj = Join-Path $dir.FullName "$name.csproj"
          if (-not (Test-Path $csproj)) {
            continue
          }

          dotnet build $csproj --no-restore -c Release
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed for $name"
          }

          $dll = Join-Path $dir.FullName "bin\Release\net10.0-windows\$name.dll"
          if (-not (Test-Path $dll)) {
            throw "Missing plugin DLL: $dll"
          }

          $stage = Join-Path $env:RUNNER_TEMP "plugin-stage-$name"
          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $stagedDll = Join-Path $stage "$name.dll"
          Copy-Item -Path $dll -Destination $stagedDll

          $forbidden = @(Get-ChildItem -Path $stage -File | Where-Object {
            $_.Name -ieq "acm.exe" -or $_.Name -ieq "acm.dll"
          })
          if ($forbidden.Count -gt 0) {
            throw "Refusing to pack host assembly: $($forbidden.Name -join ', ')"
          }

          $zipName = "$name.zip"
          $zipPath = Join-Path $dist $zipName
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path $stagedDll -DestinationPath $zipPath -Force
          Test-PluginZip -ZipPath $zipPath -PluginDllName "$name.dll"
          Write-Host "Packed $zipName"

          $packed++
        }

        if ($packed -lt 1) {
          throw "No plugin projects were packed under src/."
        }

        Write-Host "Packed $packed plugin zip(s)."

    - name: Upload plugin zips
      uses: actions/upload-artifact@v4
      with:
        name: plugin-zips
        path: dist/*.zip
        if-no-files-found: error

  publish-release:
    needs: [build-plugins]
    runs-on: windows-latest
    steps:
    - name: Download plugin zips
      uses: actions/download-artifact@v4
      with:
        name: plugin-zips
        path: dist

    - name: Publish or update the floating v1 GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $PSNativeCommandUseErrorActionPreference = $false

        $tag = "v1"
        $title = "Contract 1 plugins"
        $notes = @'
        **Plugin contract:** 1 (`IDnsValidationPlugin` as defined on ACMECertManager `main`).

        Download `<PluginName>.zip` for the DNS provider you use (overwritten on each publish). Extract the plugin DLL into `ACMECertManager/plugins/` (beside `acm.exe`) and restart ACMECertManager.

        Do not copy `acm.exe` or other host files into `plugins/`. Each zip contains only that plugin's DLL.

        Provider setup: [docs/](https://github.com/caveman8080/ACMECertManager-DnsPlugins/tree/main/docs).
        **Host app:** https://github.com/caveman8080/ACMECertManager

        This `v1` release is updated in place. A `v2` tag is only minted if the host interface breaks.
        '@
        $notes = $notes.Trim()

        $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
        [System.IO.File]::WriteAllText($notesFile, $notes + [Environment]::NewLine)

        $zips = @(Get-ChildItem -Path dist -Filter *.zip)
        if ($zips.Count -lt 1) {
          throw "No plugin zips in dist/."
        }

        gh release view $tag --json tagName 2>&1 | Out-Null
        $releaseExists = ($LASTEXITCODE -eq 0)

        if ($releaseExists) {
          gh release edit $tag --title $title --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update GitHub Release $tag."
          }
        }
        else {
          gh release create $tag --title $title --notes-file $notesFile --latest --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub Release $tag."
          }
        }

        gh release upload $tag --clobber -- $($zips.FullName)
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to upload plugin zips to GitHub Release $tag."
        }
